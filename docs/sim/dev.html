<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatail sim harness</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 Inter, system-ui, sans-serif; background: #fff; color: #17161d; }
  body.dark { background: #0e0d14; color: #f3f1fb; }
  #stage { position: absolute; inset: 0 0 96px 0; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; padding: 8px 12px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid #8884; overflow: auto; }
  button { font: inherit; padding: 6px 10px; border-radius: 999px; border: 1px solid #6c5ce7; background: transparent; color: inherit; cursor: pointer; }
  #status { flex-basis: 100%; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <button id="prev">Back</button><button id="next">Next plan</button><button id="reset">Reset</button>
  <button id="theme">Theme</button><button id="twin">Twin</button><button id="home">Home</button><button id="valve">Focus valve</button>
  <div id="status">Loading…</div>
</div>
<!-- Local test harness only. The docs page loads the same two scripts. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="spatail-sim.js"></script>
<script>
(async function () {
  const [room, plans] = await Promise.all(['data/room.json', 'data/plans.json'].map(u => fetch(u).then(r => r.json())));
  const params = new URLSearchParams(location.search);
  let theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.classList.toggle('dark', theme === 'dark');
  const sim = SpatailSim.create(document.getElementById('stage'), { room, plans, theme });
  const status = document.getElementById('status');
  let index = -1;
  const twinModes = ['solid', 'ghost', 'hidden']; let twin = 0;
  const show = (text) => status.textContent = text + '  |  builds: ' + sim.builds().map(b => b.id + (b.stepCount ? ' ' + b.currentStep + '/' + b.stepCount : '')).join(', ');
  function goto(target) {
    sim.applyPlan({ ops: [{ op: 'clear' }] });
    index = -1;
    while (index < target) { index++; sim.applyPlanAt(index); }
    show(index < 0 ? 'Empty room' : '#' + index + ' "' + plans[index].prompt + '" -> ' + plans[index].plan.reply);
  }
  document.getElementById('next').onclick = () => { if (index < plans.length - 1) { index++; const e = sim.applyPlanAt(index); show('#' + index + ' "' + e.prompt + '" -> ' + e.plan.reply); } };
  document.getElementById('prev').onclick = () => goto(Math.max(-1, index - 1));
  document.getElementById('reset').onclick = () => { sim.reset(); index = -1; show('Empty room'); };
  document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; document.body.classList.toggle('dark', theme === 'dark'); sim.setTheme(theme); };
  document.getElementById('twin').onclick = () => { twin = (twin + 1) % 3; sim.setTwinMode(twinModes[twin]); };
  document.getElementById('home').onclick = () => sim.focus(null);
  document.getElementById('valve').onclick = () => sim.focus('gate-valve');
  sim.onEvent(e => show('event ' + JSON.stringify(e)));
  window.sim = sim; window.plans = plans; window.goto = goto;
  show('Empty room');
  if (params.has('plan')) goto(parseInt(params.get('plan'), 10));
})();
</script>
</body>
</html>
