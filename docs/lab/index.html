<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatail Space Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --ink: #17161d; --muted: #6b697d; --line: #e5e2f4;
    --accent: #6c5ce7; --accent-ink: #5546d6; --accent-soft: #ece9fc; --on-accent: #ffffff;
    --warn: #c75a17; --code-bg: #f4f3fa;
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121118; --surface: #1a1922; --ink: #f1f0f7; --muted: #a09db5; --line: #2e2c3d;
      --accent: #8b7cf6; --accent-ink: #b3a8ff; --accent-soft: #2a2647; --on-accent: #121118;
      --warn: #f0a070; --code-bg: #16151d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121118; --surface: #1a1922; --ink: #f1f0f7; --muted: #a09db5; --line: #2e2c3d;
    --accent: #8b7cf6; --accent-ink: #b3a8ff; --accent-soft: #2a2647; --on-accent: #121118;
    --warn: #f0a070; --code-bg: #16151d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  .page { max-width: 1320px; margin: 0 auto; padding: 22px 16px 48px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent-ink); }
  header p { margin: 0; color: var(--muted); max-width: 72ch; }
  .theme { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink); font: 600 13px/1 var(--body); padding: 9px 13px; border-radius: 999px; cursor: pointer; }
  .loading { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1><span>Spatail</span> Space Lab</h1>
    <button type="button" class="theme" id="theme-toggle" aria-label="Switch between light and dark">Dark</button>
    <p>A stand-in for the headset. You are the wearer: look and walk around a space the app has never seen, ask for something, and the program written for that request runs in front of you.</p>
  </header>
  <div id="lab"><p class="loading">Loading the lab...</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data/spatail-data.js"></script>
<script src="spatail-lab.js"></script>
<script src="examples/examples-bundle.js"></script>
<script src="lab-ui.js"></script>
<script>
(function () {
  var root = document.getElementById('lab');
  var toggle = document.getElementById('theme-toggle');
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function label() { toggle.textContent = isDark() ? 'Light' : 'Dark'; }
  toggle.addEventListener('click', function () {
    document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    label();
  });
  label();

  if (!window.THREE || !window.SpatailLab) {
    root.innerHTML = '<p class="loading">The 3D library did not load, so the lab cannot start. Check the connection and reload.</p>';
    return;
  }
  var query = new URLSearchParams(location.search);
  window.SpatailLabUI.loadLibrary('data/spatail.js').then(function (library) {
    root.innerHTML = '';
    window.spatailLab = window.SpatailLabUI.mount(root, {
      library: library,
      compact: query.get('layout') === 'wide',
      space: query.get('space') || 'Workshop',
      seed: query.get('seed') ? parseInt(query.get('seed'), 10) : undefined,
      plannerUrl: query.get('planner') || undefined
    });
  }, function (error) {
    root.innerHTML = '<p class="loading">' + String(error.message).replace(/[<&]/g, '') + ' Open this page from a web server (or the planner service) rather than straight from disk.</p>';
  });
})();
</script>
</body>
</html>
